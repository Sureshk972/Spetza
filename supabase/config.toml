# Checkr sends webhooks with an X-Checkr-Signature header, not a Supabase
# JWT.  Disable JWT verification so the function can receive unauthenticated
# POSTs — the function validates the HMAC signature itself.
[functions.checkr-webhook]
verify_jwt = false

# Stripe Connect sends webhooks with a stripe-signature header, not a
# Supabase JWT. The function verifies the Stripe signature itself.
[functions.stripe-connect-webhook]
verify_jwt = false

# Card disputes and async payment failures arrive the same way, signed with
# this endpoint's own secret — Stripe signs each endpoint separately, so this
# cannot reuse the Connect endpoint's. The function verifies the signature.
[functions.stripe-payment-webhook]
verify_jwt = false
